<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Days</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/f1b26fbbec.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="main">
    <div class="container">
      <div class="top-bar">
        <i class="settings fa-solid fa-gear"></i>
      </div>
      <h1 class="title">Days until <span class="number_date until"></span></h1>
      <div class="dates">
        <div class="date days until"></div>
        <div class="date weeks until"></div>
        <div class="date month until"></div>
      </div>
    </div>

    <div class="container">
      <div class="top-bar">
        <i class="settings fa-solid fa-gear"></i>
      </div>
      <h1 class="title">Days from <span class="number_date from"></span></h1>
      <div class="dates">
        <div class="date days from"></div>
        <div class="date weeks from"></div>
        <div class="date month from"></div>
      </div>
    </div>

    <div class="container2">
      <h1 class="title">Choose a date <span>for the event</span></h1>
      <div class="date-input">
        <input type="date" id="date" />
        <button class="save-btn">Save</button>
      </div>
    </div>
  </div>

  <div class="notificationCard">
    <p class="notificationHeading">Info</p>
    <p class="notificationPara"></p>
    <div class="buttonContainer">
      <button class="AllowBtn">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
