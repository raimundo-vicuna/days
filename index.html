<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/f1b26fbbec.js" crossorigin="anonymous"></script>
  <title>Days</title>
</head>
<body>
  <div class="main">
    <div class="container">
      <div class="top-bar">
        <i class="settings fa-solid fa-gear"></i>
      </div>
      <div class="header">
        <h1>Days until <span class="number_date until"></span></h1>
      </div>
      <div class="dates">
        <div class="date days until" index="1"></div>
        <div class="date weeks until" index="2"></div>
        <div class="date month until" index="3"></div>
      </div>
    </div>

    <div class="container">
      <div class="top-bar">
        <i class="settings fa-solid fa-gear"></i>
      </div>
      <div class="header">
        <h1>Days from <span class="number_date from"></span></h1>
      </div>
      <div class="dates">
        <div class="date days from" index="1"></div>
        <div class="date weeks from" index="2"></div>
        <div class="date month from" index="3"></div>
      </div>
    </div>

    <div class="container2">
      <div class="header">
        <h1>Choose a date <span>for the event</span></h1>
        <div class="date-input">
          <label for="date">Date</label>
          <input type="date" id="date" />
          <button class="save-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="notificationCard">
    <p class="notificationHeading">Info</p>
    <p class="notificationPara"></p>
    <div class="buttonContainer">
      <button class="AllowBtn">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
