<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/f1b26fbbec.js" crossorigin="anonymous"></script>
  <title>Days</title>
</head>
<body>

  <div class="container">
    <i class="settings fa-solid fa-gear"></i>
    <div class="header">
      <h1>Days until <span class="number_date">20</span> of December</h1>
    </div>
    <div>
      <div class="date days"></div>
      <div class="date weeks"></div>
      <div class="date month"></div>
    </div>
  </div>

<div class="container2">
  <div class="header">
    <h1>Choose a date <span>for the event</span></h1>
    <div class="date-input">
      <label for="date">Date</label>
      <input type="date" id="date" />
      <button class="save-btn">Save</button>
    </div>
  </div>
</div>


</body>
<script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
<script src="script.js"></script>

</html>
