<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Days</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Flatpickr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Days Between</h1>
      <button id="open-config" class="btn">Settings</button>
    </header>

    <section id="view-area" class="view-area">
      <div class="card">
        <label>Since</label>
        <input id="date-from" type="date">
      </div>
      <div class="card">
        <label>Untill</label>
        <input id="date-to" type="date">
      </div>

      <div class="results">
        <div class="result-card">
          <div class="label">Days elapsed</div>
          <div id="elapsed" class="value">—</div>
        </div>
        <div class="result-card">
          <div class="label">Days Remaining</div>
          <div id="remaining" class="value">—</div>
        </div>
          <div class="result-card">
          <div class="label">Total Days</div>
          <div id="total" class="value">—</div>
        </div>
      </div>
    </section>

<section id="config-area" class="config-area hidden" aria-hidden="true">
  <div class="config-card">
    <header class="config-header">
      <h2>Settings</h2>
      <button id="close-config" class="btn ghost">Close</button>
    </header>

    <div class="config-body">
      <p>Select the dates and options.</p>
      <label>Output format</label>
      <select id="format-select">
        <option value="number">Numbers only</option>
        <option value="verbose">Verbose (e.g., 3 days)</option>
      </select>
    </div>

    <footer class="config-footer">
      <button id="apply-config" class="btn primary">Apply</button>
    </footer>
  </div>
</section>

    <footer class="footer">
      <small>RV — 2025</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
